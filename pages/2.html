<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JS (含 Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="2.css" />
    <title>product-list-page</title>
  </head>
  <body>
    <%- include('./layout/header'); -%>
    <section class="banner position-relative overflow-hidden">
      <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <!-- slide 1 -->
          <div class="carousel-item active">
            <!-- 背景圖（模糊） -->
            <img
              src="../assets/images/products-Images/bg_blur_01.png"
              class="d-block w-100 banner-bg"
              alt="blur01"
            />
            <!-- 前景主要圖片 -->
            <div class="container banner_product_ad">
              <img
                src="../assets/images/products-Images/product_ad_01.jpg"
                class="ad-img active"
                alt="ad01"
              />
            </div>
          </div>

          <!-- slide 2 -->
          <div class="carousel-item">
            <img
              src="../assets/images/products-Images/bg_blur_02.jpg"
              class="d-block w-100 banner-bg"
              alt="blur02"
            />
            <div class="container banner_product_ad">
              <img
                src="../assets/images/products-Images/product_ad_02.jpg"
                class="ad-img"
                alt="ad02"
              />
            </div>
          </div>

          <!-- slide 3 -->
          <div class="carousel-item">
            <img
              src="../assets/images/products-Images/bg_blur_03.jpg"
              class="d-block w-100 banner-bg"
              alt="blur03"
            />
            <div class="container banner_product_ad">
              <img
                src="../assets/images/products-Images/product_ad_03.jpg"
                class="ad-img"
                alt="ad03"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- Indicators 指示器 -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#bannerCarousel"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#bannerCarousel"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="#bannerCarousel"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
      </div>

      <!-- 可選：左右箭頭 -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#bannerCarousel"
        data-bs-slide="prev"
      >
        <i class="lucide" data-lucide="chevron-left"></i>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#bannerCarousel"
        data-bs-slide="next"
      >
        <i class="lucide" data-lucide="chevron-right"></i>
      </button>
    </section>

    <main class="container pt-120 pb-160">
      <div class="row">
        <!-- options -->
        <div class="col-3 pe-14">
          <!-- 篩選條件 -->
          <div class="filter-options">
            <div class="d-flex align-items-center option-title mb-16">
              <i class="lucide text-primary-300" data-lucide="funnel"></i>
              <h3 class="h5">篩選條件</h3>
            </div>
            <div class="d-flex">
              <ul class="category-list">
                <li>
                  <label><input type="checkbox" /> 嬰兒服飾</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 男孩服飾</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 女孩服飾</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 玩具</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 育兒書籍</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 哺乳用品</label>
                </li>

                <li>
                  <label
                    ><input type="checkbox" id="outdoor-parent" />
                    外出用品</label
                  >
                </li>
                <li>
                  <ul class="sub-options">
                    <li>
                      <label
                        ><input type="checkbox" class="outdoor-child" />
                        推車</label
                      >
                    </li>
                    <li>
                      <label
                        ><input type="checkbox" class="outdoor-child" />
                        揹巾</label
                      >
                    </li>
                    <li>
                      <label
                        ><input type="checkbox" class="outdoor-child" />
                        安全座椅</label
                      >
                    </li>
                  </ul>
                </li>

                <li>
                  <label><input type="checkbox" /> 媽媽用品</label>
                </li>
              </ul>
            </div>
          </div>
          <div class="border-bottom border-gray-400 my-24"></div>

          <!-- 位置（依地區） -->
          <div class="filter-options">
            <div class="d-flex align-items-center option-title mb-16">
              <i class="lucide text-primary-300" data-lucide="map-pin"></i>
              <h3 class="h5">位置（依地區）</h3>
            </div>
            <div class="d-flex">
              <ul class="category-list">
                <li>
                  <label><input type="checkbox" /> 台北</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 新北</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 桃園</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 台中</label>
                </li>
                <li>
                  <label><input type="checkbox" /> 高雄</label>
                </li>
              </ul>
            </div>
          </div>
          <div class="border-bottom border-gray-400 my-24"></div>

          <!-- 價格範圍 -->
          <div class="price-section">
            <div class="d-flex align-items-center option-title mb-16">
              <i
                class="lucide text-primary-300"
                data-lucide="circle-dollar-sign"
              ></i>
              <h3 class="h5">價格範圍</h3>
            </div>

            <div class="price-inputs">
              <div class="price-input-wrapper">
                <input
                  type="number"
                  placeholder="$最低價格"
                  id="min-price"
                  class="form-control"
                />
              </div>
              <span class="price-separator">-</span>
              <div class="price-input-wrapper">
                <input
                  type="number"
                  placeholder="$最高價格"
                  id="max-price"
                  class="form-control"
                />
              </div>
            </div>
          </div>
          <div class="border-bottom border-gray-400 my-24"></div>

          <!-- clear btn -->
          <button class="btn-clear" id="clear-filters">清除全部</button>
        </div>

        <!-- dropdown 區塊 -->
        <div class="col-9">
          <div class="row mb-40">
            <!-- 空出 4 個欄位（col-4），讓 dropdown 靠右 -->
            <div class="col-4"></div>

            <!-- dropdown 區塊佔 col-8，靠右 -->

            <!-- <div class="col-8 sort-section mb-40 d-flex"> -->
            <div class="col-8">
              <div class="sort-section">
                <!-- dropdown 1  -->
                <div class="sort-group">
                  <label class="sort-label">狀態</label>
                  <div class="dropdown">
                    <button
                      class="dropdown-toggle"
                      type="button"
                      data-bs-toggle="dropdown"
                    >
                      <span class="sort-text">不指定</span>
                      <i data-lucide="chevron-down"></i>
                    </button>
                    <ul class="dropdown-menu">
                      <li>
                        <a
                          class="dropdown-item active"
                          href="#"
                          data-value="default"
                          >不指定</a
                        >
                      </li>
                      <li>
                        <a class="dropdown-item" href="#" data-value="brandnew"
                          >全新</a
                        >
                      </li>
                      <li>
                        <a
                          class="dropdown-item"
                          href="#"
                          data-value="fairly＿new"
                          >九成新</a
                        >
                      </li>
                      <li>
                        <a class="dropdown-item" href="#" data-value="discount"
                          >七成新以下</a
                        >
                      </li>
                      <li>
                        <a class="dropdown-item" href="#" data-value="arrival"
                          >以物易物</a
                        >
                      </li>
                      <li>
                        <a class="dropdown-item" href="#" data-value="rental"
                          >可捐贈</a
                        >
                      </li>
                    </ul>
                  </div>
                </div>

                <!-- dropdown 2 -->
                <div class="sort-group">
                  <label class="sort-label">排序</label>
                  <div class="dropdown">
                    <button
                      class="dropdown-toggle"
                      type="button"
                      data-bs-toggle="dropdown"
                    >
                      <span class="sort-text">最新上架</span>
                      <i data-lucide="chevron-down"></i>
                    </button>
                    <ul class="dropdown-menu">
                      <li>
                        <a class="dropdown-item" href="#" data-value="newest"
                          >最新上架</a
                        >
                      </li>
                      <li>
                        <a
                          class="dropdown-item"
                          href="#"
                          data-value="price_low_to_high"
                          >價格由低到高</a
                        >
                      </li>
                      <li>
                        <a
                          class="dropdown-item"
                          href="#"
                          data-value="price_high_to_low"
                          >價格由高到低</a
                        >
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 商品區塊 -->
          <div class="row mb-160">
            <div class="col-4">
              <div class="product-card mb-48">
                <!-- <a href="product.html"> -->
                <div class="product-image mb-16">
                  <div class="badge paragraph-body-small d-flex">
                    <span class="badge-pink">九成新</span>
                    <span class="badge-blue">育兒省力神器</span>
                  </div>
                  <img
                    src="../assets/images/products-Images/product08.jpg"
                    alt="多功能寶寶背巾"
                    class="mb-16"
                  />
                  <button class="favorite-btn" aria-label="收藏">
                    <i class="lucide" data-lucide="heart"></i>
                  </button>

                  <div class="product-actions d-flex">
                    <button class="action-btn button" aria-label="分享">
                      <i class="lucide text-primary-300" data-lucide="send"></i>
                      <span>分享</span>
                    </button>

                    <button class="action-btn" aria-label="聊聊">
                      <i
                        class="lucide text-primary-300"
                        data-lucide="message-circle-more"
                      ></i>
                      <span>聊聊</span>
                    </button>
                  </div>
                </div>

                <div class="product-info">
                  <h3 class="h5 mb-8">多功能寶寶背巾</h3>
                  <p class="paragraph-body-small mb-8">宅配、超商店到店</p>
                  <p class="h5">NT$1,280</p>
                </div>
                <!-- </a> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="../main.js"></script>

    <%- include('./layout/footer'); -%>
    <script>
      // 初始化 Lucide
      document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
      });

      // // 取得輪播元素
      // const carousel = document.querySelector("#bannerCarousel");
      // const slides = document.querySelectorAll(".carousel-item");

      // carousel.addEventListener("slide.bs.carousel", function (event) {
      //   slides.forEach((slide) => {
      //     const img = slide.querySelector(".banner_product_ad img");
      //     if (img) img.classList.toggle("active", index === event.to);
      //   });
      // });

      // Dropdown 選項切換（Bootstrap 不會自動處理）
      const dropdownItems = document.querySelectorAll(".dropdown-item");

      dropdownItems.forEach((item) => {
        item.addEventListener("click", (e) => {
          e.preventDefault();

          // ① 移除當前 dropdown 內的 active
          siblings.forEach((i) => i.classList.remove("active"));

          // ② 移除所有 dropdown 的 active
          dropdownItems.forEach((i) => i.classList.remove("active"));

          // 加上當前選中的 active
          item.classList.add("active");

          // 更新顯示文字
          selectedSort.textContent = item.textContent;
        });
      });

      // 清除全部按鈕功能
      const clearBtn = document.getElementById("clear-filters");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          // 清除所有 checkbox
          document.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
            cb.checked = false;
          });

          // 清除價格輸入
          const minPrice = document.getElementById("min-price");
          const maxPrice = document.getElementById("max-price");
          if (minPrice) minPrice.value = "";
          if (maxPrice) maxPrice.value = "";

          // 重置排序為預設
          dropdownItems.forEach((i) => i.classList.remove("active"));
          if (dropdownItems[0]) dropdownItems[0].classList.add("active");
          if (selectedSort) selectedSort.textContent = "不指定";
        });
      }

      // 選取全部收藏按鈕
      const buttons = document.querySelectorAll(".favorite-btn");

      buttons.forEach((btn) => {
        btn.addEventListener("click", function () {
          this.classList.toggle("active");
        });
      });
    </script>
  </body>
</html>
