    <!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主廣告與最近看過商品</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ======================== 主廣告 Banner ======================== */
    .banner-carousel {
      position: relative;
      max-width: 1200px;
      margin: auto;
      overflow: hidden;
    }

    .banner-carousel .carousel-inner {
      height: 60vh; /* 高度可自行調整 */
    }

    .banner-carousel .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* --- 指示器固定在圖片底部 --- */
    .custom-indicators {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .custom-indicators button {
      width: 8px;
      height: 8px;
      border: none;
      border-radius: 50%;
      background-color: var(--bs-gray-400);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .custom-indicators button.active {
      width: 24px;
      border-radius: 2px;
      background-color: var(--bs-primary);
    }

    /* --- 左右按鈕 --- */
    .carousel-control-prev i,
    .carousel-control-next i {
      color: white;
      width: 32px;
      height: 32px;
    }

    /* ======================== 最近看過商品 ======================== */
    .recent-section {
      max-width: 1200px;
      margin: 60px auto;
      position: relative;
    }

    .recent-products {
      display: flex;
      transition: transform 0.5s ease;
      overflow: hidden;
    }

    .product-card {
      flex: 0 0 25%; /* 一行顯示四個 */
      padding: 8px;
      box-sizing: border-box;
    }

    .product-card img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card img:hover {
      transform: scale(1.05);
    }

    /* --- 左右箭頭按鈕 --- */
    .recent-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 5;
      box-shadow: 0 0 6px rgba(0,0,0,0.2);
    }

    .recent-btn.prev { left: -22px; }  /* 一半在外面 */
    .recent-btn.next { right: -22px; }
  </style>
</head>
<body>

  <!-- ======================== 主廣告 Banner ======================== -->
  <div id="bannerCarousel" class="carousel slide banner-carousel" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/1200/500?1" alt="Banner 1">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1200/500?2" alt="Banner 2">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1200/500?3" alt="Banner 3">
      </div>
    </div>

    <!-- 自訂指示器 -->
    <div class="custom-indicators">
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="2"></button>
    </div>

    <!-- 左右按鈕 -->
    <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel" data-bs-slide="prev">
      <i data-lucide="chevron-left"></i>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel" data-bs-slide="next">
      <i data-lucide="chevron-right"></i>
    </button>
  </div>

  <!-- ======================== 最近看過商品 ======================== -->
  <section class="recent-section">
    <h3 class="mb-3">最近看過的商品</h3>
    <div class="recent-products">
      <div class="product-card"><img src="https://picsum.photos/300/300?1" alt="P1"></div>
      <div class="product-card"><img src="https://picsum.photos/300/300?2" alt="P2"></div>
      <div class="product-card"><img src="https://picsum.photos/300/300?3" alt="P3"></div>
      <div class="product-card"><img src=

    <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
  </body>
</html>
